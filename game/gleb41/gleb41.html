<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сорок первая строка — дополнение к «Тот, кто остался»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* «Сорок первая строка»: ночь Глеба. Холодный лабораторный синий; тепло — только приметы мамы. */
:root{color-scheme:dark;
 --bg:#070a11;--panel:#0e1420;--panel2:#141d2c;--line:#243449;--fg:#dfe6ee;--dim:#7d8aa0;
 --acc:#7cc4e8;--gold:#f2b95c;--red:#d96355;--vio:#9d8fd6;
 --f-t:"Unbounded",system-ui,sans-serif;--f-b:"Lora",Georgia,serif;--f-m:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-b);
 background-image:radial-gradient(circle at 1px 1px,rgba(124,196,232,.06) 1px,transparent 0);background-size:26px 26px;
 padding-block:0 48px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px}
button:focus-visible{outline:2px solid var(--acc)}
.game{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hud{position:sticky;top:env(safe-area-inset-top,0);z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
 background:linear-gradient(var(--bg) 80%,rgba(7,10,17,0));padding:12px 0 10px}
.clock{font:500 34px/1 var(--f-m);color:var(--acc)}.clock small{display:block;font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.meters{display:flex;gap:10px;flex-wrap:wrap;min-width:0}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:130px}
.meter .lbl{display:flex;justify-content:space-between;font:10.5px var(--f-m);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.meter .bar{position:relative;height:7px;background:var(--panel2);border-radius:4px;margin-top:5px;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;transition:width .5s}
.m-drift .bar i{background:linear-gradient(90deg,#4a5f8a,var(--vio),#e2c2ff)}
.m-molva .bar i{background:linear-gradient(90deg,#8a6b3a,var(--gold))}
.tbtn{padding:8px 12px;font-size:13px}.tbtn b{color:var(--gold)}
.hud2{display:flex;gap:8px;align-items:center}
@media (max-width:640px){.hud{grid-template-columns:auto 1fr}.meters{grid-column:1/-1;grid-row:2}.clock{font-size:26px}}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.p-t{font:11px var(--f-m);color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
#mapsvg{display:block;width:100%;height:auto}
.mapdot{cursor:pointer}
.mapdot circle{transition:r .2s}
.mapdot:hover circle{stroke-width:2.5}
.mapdot text{font:11px var(--f-m);fill:var(--dim);pointer-events:none}
.mapdot text.tn{fill:var(--fg);font-family:var(--f-b);font-size:11.5px}
.scene{font-size:15.5px;line-height:1.7;min-height:64px}
.acts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.acts button{text-align:left;padding:9px 12px;line-height:1.4}
.acts button:hover{border-color:var(--acc)}
.acts button.death{border-color:#4a2622;color:#e8b6ae}
.acts button.death:hover{border-color:var(--red)}
.acts .off{color:var(--dim);cursor:not-allowed}
.go{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.go button{padding:5px 9px;font:12px var(--f-m);color:var(--dim)}
.go button:hover{color:var(--fg);border-color:var(--acc)}
.log{max-height:170px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.log p{margin:0;padding-left:10px;border-left:2px solid var(--line)}
.log .x{border-color:var(--red)}.log .g{border-color:var(--ok,#86c49e)}.log .a{border-color:var(--vio)}.log .h{border-color:var(--acc)}
.log .t{font:10.5px var(--f-m);color:var(--dim);margin-right:6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(4,6,10,.78);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.sheet h3{margin:0 0 12px;font:400 18px var(--f-t)}
.sheet table{width:100%;border-collapse:collapse;font:12px var(--f-m)}
.sheet td,.sheet th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.sheet th{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
.sheet tr.new td{color:var(--gold)}
.end{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:22px}
.end h3{font:400 20px var(--f-t);margin:0 0 14px;color:var(--gold)}
.end p{font-size:16px;line-height:1.8}
.end .dim{color:var(--dim);font:12px var(--f-m)}
.kicker{font:10.5px var(--f-m);color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin:0}
</style></head><body>
<div class="game">
  <div class="hud">
    <div class="clock"><span id="clock">01:00</span><small>ночь на 14 марта 2015 · Юрга</small></div>
    <div class="meters">
      <div class="meter m-drift"><div class="lbl"><span>Дрейф</span><span id="driftN">0/5</span></div><div class="bar"><i id="driftB" style="width:0"></i></div></div>
      <div class="meter m-molva"><div class="lbl"><span>Молва</span><span id="molvaN">0</span></div><div class="bar"><i id="molvaB" style="width:0"></i></div></div>
    </div>
    <div class="hud2"><button class="tbtn" id="btn-table">Таблица · <b id="rowsN">40</b> строк</button><button class="tbtn" id="btn-restart">заново</button></div>
  </div>

  <div class="cols">
    <div class="panel">
      <p class="p-t">Юрга, карта ночи</p>
      <svg id="mapsvg" viewBox="0 0 1536 1024" role="img" aria-label="Карта Юрги"></svg>
    </div>
    <div class="panel">
      <p class="p-t" id="locname">—</p>
      <div class="scene" id="scene"></div>
      <div class="acts" id="acts"></div>
      <p class="p-t" style="margin-top:14px">Идти</p>
      <div class="go" id="go"></div>
    </div>
  </div>

  <div class="panel">
    <p class="p-t">Ночь в записях</p>
    <div class="log" id="log"></div>
  </div>

  <p class="kicker">Дополнение «Сорок первая строка» · Глеб Ростоцкий · проходит за одну ночь · не требует основной игры</p>
</div>

<div class="modal" id="m-table"><div class="sheet">
  <h3>Таблица40_финал.xlsx</h3>
  <div id="table-body"></div>
  <p class="dim" style="font:12px var(--f-m)">Сорок миров, в которых Глеба похоронили. Сорок первая строка пустая.</p>
  <button id="btn-table-close" style="margin-top:10px;padding:8px 14px">закрыть</button>
</div></div>

<div class="modal" id="m-end"><div class="sheet end" id="end-body"></div></div>

<script src="core.js"></script>
<script>
(function(){
  const $ = (s) => document.querySelector(s);
  let S = window.G.fresh();
  const render = () => {
    $('#clock').textContent = window.G.hm(S.t);
    $('#driftN').textContent = S.N + '/5'; $('#driftB').style.width = Math.min(100, S.N * 20) + '%';
    $('#molvaN').textContent = S.M; $('#molvaB').style.width = Math.min(100, S.M * 10) + '%';
    $('#rowsN').textContent = S.rows.length;
    $('#locname').textContent = window.G.LOC[S.loc].n;
    $('#scene').textContent = window.G.descr(S);
    const acts = document.getElementById('acts'); acts.innerHTML = '';
    for (const a of window.G.list(S)) {
      const b = document.createElement('button');
      if (a.kind === 'die') b.className = 'death';
      b.innerHTML = a.lbl + (a.min ? ' <span class="mono" style="color:var(--dim);font-size:11px">+' + a.min + ' мин</span>' : '');
      if (a.off) { b.className = 'off'; b.innerHTML = a.lbl + ' <span style="color:var(--dim);font-size:12px">— ' + a.off + '</span>'; }
      else b.onclick = () => { const r = window.G.apply(S, a.id); after(r); };
      acts.append(b);
    }
    const go = document.getElementById('go'); go.innerHTML = '';
    for (const m of window.G.moves(S)) {
      const b = document.createElement('button');
      b.textContent = window.G.LOC[m.to].n + ' · ' + m.min + ' мин';
      b.onclick = () => { window.G.apply(S, 'go:' + m.to); after({ kind: 'go' }); };
      go.append(b);
    }
    const log = document.getElementById('log'); log.innerHTML = '';
    for (const l of S.log.slice(0, 24)) {
      const p = document.createElement('p'); p.className = l.cls;
      p.innerHTML = '<span class="t">' + window.G.hm(l.t) + '</span>' + l.txt;
      log.append(p);
    }
    drawMap();
    if (S.ending && S.over) showEnd();
  };
  const after = (r) => { if (r && r.kind === 'die') showDie(r); render(); };
  const showDie = (r) => {
    showSheet('m-table', '<h3>✝ ' + r.d.lbl + '</h3><p style="white-space:pre-line">' + r.d.die + '</p>' +
      (r.r ? '<p style="white-space:pre-line;color:var(--gold)">— В мире, где Глеб остался жить:<br>' + r.r.why + '</p>' : '') +
      (r.r && r.r.seen ? '<p style="white-space:pre-line;color:var(--dim)">Видели: ' + r.r.seen + '</p>' : '') +
      '<p style="color:var(--vio)">Дрейф: ' + S.N + ' из 5.</p><button onclick="document.getElementById(\'m-table\').classList.remove(\'open\')" style="margin-top:10px;padding:8px 14px">дальше</button>');
  };
  const openSheet = (title, html) => { document.querySelector('#m-table .sheet').innerHTML = ''; const m = document.getElementById('m-end'); };
  const showSheet = (id, html) => { const sheet = document.querySelector('#' + id + ' .sheet'); sheet.innerHTML = html; document.getElementById(id).classList.add('open'); };
  const showTable = () => {
    const rows = S.rows.map((r, i) => '<tr' + (i >= 40 ? ' class="new"' : '') + '><td>' + (i + 1) + '</td><td>' + r.d + '</td><td>' + r.p + '</td><td>' + (r.m || '—') + '</td></tr>').join('');
    showSheet('m-table', '<h3>Таблица40_финал.xlsx</h3><table><tr><th>№</th><th>Дата</th><th>Место</th><th>Примета</th></tr>' + rows + '<tr class="new"><td>' + (S.rows.length + 1) + '</td><td>…</td><td>…</td><td>пусто</td></tr></table><button onclick="document.getElementById(\'m-table\').classList.remove(\'open\')" style="margin-top:10px;padding:8px 14px">закрыть</button>');
  };
  const showEnd = () => {
    const e = window.G.endingText(S);
    document.getElementById('end-body').innerHTML = '<p class="kicker">Финал дополнения</p><h3>' + e.h + '</h3>' + e.p.map(x => '<p>' + x + '</p>').join('') + '<p class="dim">«Сорок первая строка» · дополнение к «Тот, кто остался» · Глеб Ростоцкий · ночь на 14 марта 2015</p><button id="end-ok" style="margin-top:8px;padding:9px 16px">закрыть</button>';
    document.getElementById('m-end').classList.add('open');
    document.getElementById('end-ok').onclick = () => document.getElementById('m-end').classList.remove('open');
  };
  const drawMap = () => {
    const svg = document.getElementById('mapsvg');
    const L = window.G.LOC;
    let edges = '';
    const seen = new Set();
    for (const e of window.G.EDGES_SRC || []) {}
    // рёбра рисуем по списку пар (уникальных)
    const pairs = window.G.EDGES_PAIRS || [];
    for (const [a, b] of pairs) {
      const A = L[a], B2 = L[b];
      edges += '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B2.x + '" y2="' + B2.y + '" stroke="#243449" stroke-width="2" stroke-opacity=".8"/>';
    }
    let dots = '';
    for (const [id, l] of Object.entries(L)) {
      const here = id === S.loc;
      const col = here ? '#f2b95c' : '#7cc4e8';
      dots += '<g class="mapdot" data-loc="' + id + '"><circle cx="' + l.x + '" cy="' + l.y + '" r="' + (here ? 11 : 7) + '" fill="' + (here ? 'rgba(242,185,92,.25)' : 'rgba(124,196,232,.12)') + '" stroke="' + col + '" stroke-width="' + (here ? 2 : 1.4) + '"/><text class="tn" x="' + (l.x + 14) + '" y="' + (l.y + 4) + '">' + l.n.replace('&', ' ') + '</text></g>';
    }
    svg.innerHTML = edges + dots;
    svg.querySelectorAll('.mapdot').forEach((g) => g.addEventListener('click', () => {
      const to = g.getAttribute('data-loc');
      const m = window.G.moves(S).find((x) => x.to === to);
      if (m) { window.G.apply(S, 'go:' + to); after({ kind: 'go' }); }
    }));
  };
  window.G.EDGES_PAIRS = window.G.EDGES;
  document.getElementById('btn-table').onclick = showTable;
  document.getElementById('btn-table-close').onclick = () => document.getElementById('m-table').classList.remove('open');
  document.getElementById('btn-restart').onclick = () => { S = window.G.fresh(); document.getElementById('m-end').classList.remove('open'); render(); };
  document.getElementById('m-table').addEventListener('click', (e) => { if (e.target.id === 'm-table') e.target.classList.remove('open'); });
  document.getElementById('m-end').addEventListener('click', (e) => { if (e.target.id === 'm-end') e.target.classList.remove('open'); });
  render();
})();
</script>
</body>
</html>
